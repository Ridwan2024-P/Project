<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h2>Admin Dashboard</h2>
  </header>

  <main class="container">
    <section class="table-section">
      <h3>Judges' Submitted Scores</h3>
      <table>
        <thead>
          <tr>
            <th>Judge Name</th>
            <th>Group Number</th>
            <th>Total Score</th>
            <th>Comments</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Judge 1</td>
            <td>1</td>
            <td>52</td>
            <td>Excellent teamwork</td>
          </tr>
          <tr>
            <td>Judge 2</td>
            <td>1</td>
            <td>48</td>
            <td>Good effort</td>
          </tr>
        </tbody>
      </table>

      <div class="summary">
        <p><strong>Group Average:</strong> 50</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Admin Panel © 2025</p>
  </footer>
</body>
</html>
