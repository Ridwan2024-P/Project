<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h2>Admin Dashboard</h2>
  </header>

  <main class="container">
    <section class="table-section">
      <h3>Judges' Submitted Scores</h3>
      <table>
        <thead>
          <tr>
            <th>Judge Name</th>
            <th>Group Number</th>
            <th>Total Score</th>
            <th>Comments</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Judge 1</td>
            <td>1</td>
            <td>52</td>
            <td>Excellent teamwork</td>
          </tr>
          <tr>
            <td>Judge 2</td>
            <td>1</td>
            <td>48</td>
            <td>Good effort</td>
          </tr>
        </tbody>
      </table>

      <div class="summary">
        <p><strong>Group Average:</strong> 50</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Admin Panel © 2025</p>
  </footer>
</body>
</html>

<style>/* General Layout */
body {
  font-family: Arial, sans-serif;
  background-color: #f5f7fa;
  margin: 0;
  padding: 0;
}

.header {
  background-color: #002b5c;
  color: white;
  padding: 15px 0;
  text-align: center;
}

.container {
  width: 90%;
  max-width: 900px;
  margin: 30px auto;
  background-color: white;
  padding: 20px 30px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  border-radius: 10px;
}

h3 {
  text-align: center;
  color: #002b5c;
}

/* Tables */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th, td {
  border: 1px solid #ccc;
  padding: 10px;
  text-align: center;
}

th {
  background-color: #e5ecf5;
}

/* Forms */
input[type="text"],
input[type="number"],
textarea {
  width: 100%;
  padding: 8px;
  margin: 5px 0 15px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
}

textarea {
  resize: vertical;
  height: 80px;
}

button {
  display: block;
  width: 100%;
  background-color: #002b5c;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background-color: #004b9a;
}

.footer {
  text-align: center;
  padding: 15px 0;
  margin-top: 20px;
  background-color: #f0f0f0;
  color: #333;
  font-size: 14px;
}

.summary {
  margin-top: 20px;
  text-align: right;
  font-weight: bold;
}
</style>
